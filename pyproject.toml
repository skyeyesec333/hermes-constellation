[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-constellation"
version = "0.1.0"
description = "Local-first, source-grounded knowledge and relationship workspace for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Hermes Constellation contributors"}]
keywords = ["hermes-agent", "obsidian", "knowledge-base", "provenance", "ocr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "python-magic>=0.4.27,<0.5",
]

[project.urls]
Homepage = "https://github.com/skyeyesec333/hermes-constellation"
Repository = "https://github.com/skyeyesec333/hermes-constellation"
Issues = "https://github.com/skyeyesec333/hermes-constellation/issues"

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
graph = ["networkx>=3.2,<4"]
office = [
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "markitdown[pptx]>=0.1,<0.2",
]
ocr = [
  "Pillow>=10,<13",
  "rapidocr-onnxruntime>=1.4,<2",
]
identity = [
  "rapidfuzz>=3,<4",
  "phonenumbers>=9,<10",
  "email-validator>=2,<3",
]
audio = [
  "faster-whisper>=1,<2",
]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1.2", "hatchling>=1.25", "ruff>=0.5"]

[project.scripts]
constellation = "constellation.cli:main"

[project.entry-points."hermes_agent.plugins"]
constellation = "hermes_constellation_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/constellation", "src/hermes_constellation_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "hermes_constellation_plugin/plugin.yaml"
"skills/constellation" = "hermes_constellation_plugin/skills/constellation"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
